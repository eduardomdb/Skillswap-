<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSwap - Registro</title>
  <link rel="stylesheet" href="./css/registro.css">
</head>
<body class="auth-body">

  <main class="auth-card registro-card">
    <div class="auth-header">
      <img src="./assets/logo.jpeg" alt="Logo SkillSwap" class="auth-logo">
      <h1>Registro de estudiante</h1>
      <p class="auth-tagline">Crea tu cuenta en SkillSwap</p>
      
      <div class="imagen-registro-container">
        <img src="./assets/fotoRegistro.jpeg" alt="Estudiantes intercambiando habilidades" class="img-registro-banner">
      </div>
    </div>

    <!-- Formulario limpio solo con datos personales y disponibilidad -->
    <form id="form-registro" class="auth-form">
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" autocomplete="name" required>
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="nombre@utepsa.edu.bo" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Cree una contraseña" autocomplete="new-password" required>
      </div>

      <div class="form-group">
        <label for="numero">Teléfono / WhatsApp</label>
        <input type="tel" id="numero" name="numero" placeholder="Ingrese su teléfono" autocomplete="tel" required>
      </div>

      <div class="form-group">
        <label for="dias">Disponibilidad de días</label>
        <input type="text" id="dias" name="dias" placeholder="Ej. Lunes y Miércoles" required>
      </div>

      <div class="form-group">
        <label for="turno">Disponibilidad de horario</label>
        <input type="text" id="turno" name="turno" placeholder="Ej. Tarde (15:00 - 18:00)" required>
      </div>

      <div class="form-group campo-archivo">
        <label for="foto">Subir foto de perfil (opcional):</label>
        <input type="file" id="foto" name="foto" accept="image/*">
      </div>

      <button type="submit" class="btn-primario">Registrarse</button>

      <p class="auth-footer">
        ¿Ya tienes una cuenta? <a href="index.html">Inicia sesión</a>
      </p>
    </form>
  </main>

  <script src="./js/registro.js"></script>
</body>
</html>
