<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSwap - Registro</title>
  <link rel="stylesheet" href="./css/registro.css">
  <style>
    :root {
      --primary: #2563EB;
      --primary-dark: #172554;
      --dark: #0F172A;
      --gray: #64748B;
      --white: #FFFFFF;
    }

    body.auth-body {
      background: linear-gradient(135deg, #e0e7ff 0%, #bfdbfe 45%, #93c5fd 100%) !important;
      background-attachment: fixed !important;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card.registro-card {
      background-color: var(--white);
      width: 100%;
      max-width: 460px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(23, 37, 84, 0.12);
      border: 1px solid #cbd5e1;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-logo {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-bottom: 12px;
      border-radius: 50%;
    }

    .auth-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 4px;
    }

    .auth-tagline {
      font-size: 14px;
      color: var(--gray);
      margin-bottom: 16px;
    }

    .imagen-registro-container {
      width: 100%;
      max-height: 140px;
      overflow: hidden;
      border-radius: 8px;
      margin-top: 10px;
    }

    .img-registro-banner {
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--dark);
    }

    .form-group input {
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .campo-archivo input[type="file"] {
      font-size: 13px;
      padding: 6px 0;
      border: none;
    }

    .btn-primario {
      background-color: var(--primary);
      color: var(--white);
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    .btn-primario:hover {
      background-color: #1d4ed8;
    }

    .auth-footer {
      text-align: center;
      font-size: 13px;
      color: var(--gray);
      margin-top: 16px;
    }

    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body class="auth-body">

  <main class="auth-card registro-card">
    <div class="auth-header">
      <img src="./assets/logo.jpeg" alt="Logo SkillSwap" class="auth-logo">
      <h1>Registro de estudiante</h1>
      <p class="auth-tagline">Crea tu cuenta en SkillSwap</p>
      
      <div class="imagen-registro-container">
        <img src="./assets/fotoRegistro.jpeg" alt="Estudiantes intercambiando habilidades" class="img-registro-banner">
      </div>
    </div>

    <form id="form-registro" class="auth-form">
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" autocomplete="name" required>
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="nombre@utepsa.edu.bo" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Cree una contraseña" autocomplete="new-password" required>
      </div>

      <div class="form-group">
        <label for="numero">Teléfono / WhatsApp</label>
        <input type="tel" id="numero" name="numero" placeholder="Ingrese su teléfono" autocomplete="tel" required>
      </div>

      <div class="form-group">
        <label for="dias">Disponibilidad de días</label>
        <input type="text" id="dias" name="dias" placeholder="Ej. Lunes y Miércoles" required>
      </div>

      <div class="form-group">
        <label for="turno">Disponibilidad de horario</label>
        <input type="text" id="turno" name="turno" placeholder="Ej. Tarde (15:00 - 18:00)" required>
      </div>

      <div class="form-group campo-archivo">
        <label for="foto">Subir foto de perfil (opcional):</label>
        <input type="file" id="foto" name="foto" accept="image/*">
      </div>

      <button type="submit" class="btn-primario">Registrarse</button>

      <p class="auth-footer">
        ¿Ya tienes una cuenta? <a href="index.html">Inicia sesión</a>
      </p>
    </form>
  </main>

  <script src="./js/registro.js"></script>
</body>
</html>
