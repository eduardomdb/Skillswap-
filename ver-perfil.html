<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSwap - Ver Perfil</title>
  <style>
    :root {
      --primary: #2563EB;
      --primary-dark: #172554;
      --accent: #60A5FA;
      --dark: #0F172A;
      --gray: #64748B;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e0e7ff 0%, #bfdbfe 45%, #93c5fd 100%);
      background-attachment: fixed;
      color: var(--dark);
      min-height: 100vh;
    }

    .barra-superior {
      background-color: var(--primary-dark);
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(23, 37, 84, 0.2);
    }

    .btn-volver {
      background-color: rgba(255, 255, 255, 0.12);
      color: var(--white);
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      text-decoration: none;
    }

    .btn-volver:hover {
      background-color: rgba(255, 255, 255, 0.22);
    }

    .perfil-contenedor {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .perfil-encabezado {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .perfil-titulo {
      font-size: 26px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .perfil-subtitulo {
      font-size: 14px;
      color: #334155;
      margin-top: 4px;
    }

    .btn-editar {
      background-color: var(--primary);
      color: var(--white);
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
      transition: background-color 0.2s;
    }

    .btn-editar:hover {
      background-color: #1d4ed8;
    }

    .sin-perfil {
      background-color: var(--white);
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      color: var(--gray);
      border: 1px solid #cbd5e1;
      box-shadow: 0 4px 12px rgba(23, 37, 84, 0.08);
    }

    .sin-perfil a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .sin-perfil a:hover {
      text-decoration: underline;
    }

    .tarjeta-datos {
      background-color: var(--white);
      border-radius: 12px;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      gap: 28px;
      box-shadow: 0 4px 12px rgba(23, 37, 84, 0.08);
      border: 1px solid #cbd5e1;
      margin-bottom: 20px;
    }

    .zona-avatar {
      flex-shrink: 0;
    }

    .perfil-foto {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
    }

    .perfil-avatar-defecto {
      width: 90px;
      height: 90px;
      background-color: #eff6ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #cbd5e1;
    }

    .perfil-avatar-defecto svg {
      width: 45px;
      height: 45px;
      fill: var(--primary);
    }

    .info-usuario {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nombre-usuario {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 2px;
    }

    .linea-info {
      font-size: 14px;
      color: var(--gray);
    }

    .grid-habilidades {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .caja-seccion {
      background-color: var(--white);
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(23, 37, 84, 0.08);
      margin-bottom: 20px;
    }

    .caja-header {
      background-color: var(--primary-dark);
      color: var(--white);
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
    }

    .caja-cuerpo {
      padding: 18px;
      font-size: 15px;
      color: var(--dark);
      min-height: 60px;
      display: flex;
      align-items: center;
    }

    @media (max-width: 768px) {
      .grid-habilidades {
        grid-template-columns: 1fr;
      }
      .tarjeta-datos {
        flex-direction: column;
        text-align: center;
      }
      .perfil-encabezado {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
    }
  </style>
</head>
<body>

  <header class="barra-superior">
    <button type="button" onclick="window.location.href='inicio.html'" class="btn-volver">← Volver a inicio</button>
  </header>

  <main class="perfil-contenedor">

    <div class="perfil-encabezado">
      <div>
        <h1 class="perfil-titulo">Perfil de estudiante</h1>
        <p class="perfil-subtitulo">Detalles del intercambio de habilidades</p>
      </div>
      <button type="button" id="btn-editar-perfil" class="btn-editar">Editar perfil</button>
    </div>

    <div id="sin-perfil" class="sin-perfil" style="display: none;">
      No se encontró información de este perfil. <a href="inicio.html">Volver a inicio</a>
    </div>

    <div id="contenido-perfil">

      <section class="tarjeta-datos">
        <div class="zona-avatar">
          <img id="perfil-foto" src="" alt="Foto de perfil" class="perfil-foto" style="display: none;">
          <div id="perfil-avatar-defecto" class="perfil-avatar-defecto">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
          </div>
        </div>

        <div class="info-usuario">
          <h2 id="perfil-nombre" class="nombre-usuario">Nombre</h2>
          <p id="perfil-correo" class="linea-info">Correo</p>
          <p id="perfil-telefono" class="linea-info">Número</p>
        </div>
      </section>

      <section class="grid-habilidades">
        <div class="caja-seccion">
          <div class="caja-header">Enseña</div>
          <div id="lista-ensena" class="caja-cuerpo"></div>
        </div>

        <div class="caja-seccion">
          <div class="caja-header">Quiere aprender</div>
          <div id="lista-busca" class="caja-cuerpo"></div>
        </div>
      </section>

      <section class="caja-seccion caja-disponibilidad">
        <div class="caja-header">Disponibilidad</div>
        <div id="caja-disponibilidad-cuerpo" class="caja-cuerpo"></div>
      </section>

    </div>
  </main>

  <script src="./js/ver-perfil.js"></script>
</body>
</html>
